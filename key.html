<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔑 Nhận Key Free 16 Giờ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .box {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .icon { font-size: 60px; }
        h1 { color: #333; font-size: 24px; }
        .btn {
            background: #764ba2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .key-box {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            display: none;
        }
        .key-code {
            font-size: 24px;
            font-weight: bold;
            color: #764ba2;
            word-break: break-all;
            letter-spacing: 1px;
        }
        .copy-btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .countdown {
            font-size: 18px;
            color: #ff5722;
            font-weight: bold;
            margin: 10px 0;
            display: none;
        }
        .info {
            margin-top: 15px;
            color: #666;
            font-size: 13px;
            line-height: 1.5;
        }
        .steps {
            text-align: left;
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }
        .steps ol {
            padding-left: 20px;
            color: #666;
            line-height: 1.8;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon">🔑</div>
        <h1>Nhận Key Free 16 Giờ</h1>
        <p style="color: #666;">✅ Bạn đã vượt link thành công!</p>

        <div class="steps">
            <strong>📌 Các bước:</strong>
            <ol>
                <li>Click nút "LẤY KEY" bên dưới</li>
                <li>Chờ 5 giây hệ thống tạo key</li>
                <li>Copy key nhận được</li>
                <li>Về Telegram nhập: <code>/nhapkeyfree [key]</code></li>
            </ol>
        </div>

        <button class="btn" id="getKeyBtn" onclick="getKey()">
            🎁 LẤY KEY NGAY
        </button>

        <div class="countdown" id="countdown"></div>

        <div class="key-box" id="keyBox">
            <p style="margin-bottom: 10px;">✅ Key của bạn:</p>
            <div class="key-code" id="keyCode"></div>
            <button class="copy-btn" onclick="copyKey()">📋 Copy Key</button>
        </div>

        <div class="info">
            📌 Key hiệu lực: <strong>16 giờ</strong><br>
            🤖 Bot: <strong>@danhsapgame_bot</strong><br>
            ⏳ Mỗi 12 giờ lấy 1 lần
        </div>
    </div>

    <script>
        // HÀM TẠO KEY RANDOM
        function generateRandomKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = 'FL-';
            for (let i = 0; i < 10; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return key;
        }

        function getKey() {
            const btn = document.getElementById('getKeyBtn');
            const countdown = document.getElementById('countdown');
            const keyBox = document.getElementById('keyBox');
            const keyCode = document.getElementById('keyCode');

            btn.disabled = true;
            btn.textContent = '⏳ Đang tạo key...';
            countdown.style.display = 'block';

            let seconds = 5;
            countdown.textContent = '⏳ Chờ ' + seconds + ' giây...';

            const timer = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    countdown.textContent = '⏳ Chờ ' + seconds + ' giây...';
                } else {
                    clearInterval(timer);
                    countdown.style.display = 'none';
                    
                    // Tạo key random
                    const randomKey = generateRandomKey();
                    keyCode.textContent = randomKey;
                    keyBox.style.display = 'block';
                    btn.textContent = '✅ Đã lấy key!';
                }
            }, 1000);
        }

        function copyKey() {
            const keyCode = document.getElementById('keyCode').textContent;
            navigator.clipboard.writeText(keyCode).then(() => {
                alert('✅ Đã copy key: ' + keyCode + '\n\nVề Telegram nhập: /nhapkeyfree ' + keyCode);
            }).catch(() => {
                // Fallback
                const textarea = document.createElement('textarea');
                textarea.value = keyCode;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert('✅ Đã copy key: ' + keyCode + '\n\nVề Telegram nhập: /nhapkeyfree ' + keyCode);
            });
        }
    </script>
</body>
</html>
